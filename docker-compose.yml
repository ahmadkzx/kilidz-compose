services:
  api:
    build: ./api
    container_name: api
    env_file:
    - ./api/.env
    ports:
      - "127.0.0.1:3001:3001"
    expose:
      - "3001"
    restart: always

  ui:
    build: ./ui
    container_name: ui
    env_file:
      - ./ui/.env
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"
    restart: always
